<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    background: #0f0f0f;
    min-height: 100vh;
    min-height: 100dvh; /* dynamic viewport height for mobile browsers */
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    touch-action: manipulation;
  }

  .wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px 0 90px; /* leave room for the hint at bottom */
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 560px;
    animation: stage-in 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
  }
  @keyframes stage-in {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .poster {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* Tap zones over each strip */
  .strip {
    position: absolute;
    display: block;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    .strip:hover {
      background: rgba(255, 255, 200, 0.18);
      transform: translateY(2px);
    }
  }
  .strip:active {
    background: rgba(255, 200, 0, 0.45);
    transform: translateY(5px);
  }

  /* Strip positions (% of stage = % of poster) */
  .s0 { left: 9.5%;  top: 71%; width: 12.5%; height: 19%; }
  .s1 { left: 30.5%; top: 71%; width: 10.5%; height: 19%; }
  .s2 { left: 41.5%; top: 71%; width: 10.5%; height: 19%; }
  .s3 { left: 52.5%; top: 71%; width: 10.5%; height: 19%; }
  .s4 { left: 63.5%; top: 71%; width: 10.5%; height: 19%; }
  .s5 { left: 74.5%; top: 71%; width: 10.5%; height: 19%; }
  .s6 { left: 85.5%; top: 71%; width: 10.5%; height: 19%; }

  /* Bottom hint pill */
  .hint {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95);
    color: #0f0f0f;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.2px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    animation: hint-in 0.6s 0.8s backwards, hint-bob 2.5s 1.4s ease-in-out infinite;
  }
  @keyframes hint-in {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes hint-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }
  .hint.fade {
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* Larger screens — center poster vertically */
  @media (min-height: 800px) and (min-width: 500px) {
    .wrap { align-items: center; }
  }
</style>
